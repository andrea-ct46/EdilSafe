<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdilSafe - Audit Documentale Cantiere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- 1. Aggiungiamo la libreria ufficiale di Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- SCHERMATA DI LOGIN (Visibile all'inizio) -->
    <div id="loginView" class="max-w-md mx-auto mt-20 p-8 bg-white border border-slate-200 rounded-xl shadow-sm">
        <div class="text-center mb-8">
            <span class="text-4xl">🏗️</span>
            <h1 class="text-2xl font-bold text-blue-700 mt-2">EdilSafe</h1>
            <p class="text-sm text-slate-500 mt-1">Accedi per analizzare i tuoi documenti</p>
        </div>
        
        <div class="space-y-4">
            <input type="email" id="emailInput" placeholder="La tua email" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:border-blue-500 focus:outline-none">
            <input type="password" id="passwordInput" placeholder="Password" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:border-blue-500 focus:outline-none">
            
            <button id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-all">Accedi / Registrati</button>
            <p id="authMessage" class="text-xs text-center text-rose-600 hidden"></p>
        </div>
    </div>

    <!-- DASHBOARD PRINCIPALE (Nascosta all'inizio) -->
    <div id="dashboardView" class="max-w-5xl mx-auto p-6 space-y-6 hidden">
        
        <header class="flex justify-between items-center bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🏗️</span>
                <span class="text-xl font-bold text-blue-700 tracking-tight">EdilSafe</span>
            </div>
            <div class="flex items-center gap-4 text-sm text-slate-500">
                <span id="creditiBadge" class="bg-blue-50 text-blue-700 border border-blue-200 px-3 py-1 rounded-full font-semibold">Crediti: ...</span>
                <button id="btnLogout" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1 rounded">Esci</button>
            </div>
        </header>

        <!-- (Qui va reinserito tutto il blocco della Grid con Drag&Drop, Configurazione e Risultati che avevamo prima, non l'ho rimesso tutto per brevità) -->
        <div class="text-center p-10 text-slate-500">
            [ Area Applicazione - Inserisci qui l'HTML dell'interfaccia precedente ]
        </div>

    </div>

    <script>
        // 2. Inserisci qui i tuoi dati Supabase
        const SUPABASE_URL = 'https://tknjthnrqunkehcqdnrj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_L5SprRAfCuKNZ-GIwT_1tw_iuknN81x';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const btnLogin = document.getElementById('btnLogin');
        const btnLogout = document.getElementById('btnLogout');
        const authMessage = document.getElementById('authMessage');
        const creditiBadge = document.getElementById('creditiBadge');

        // Controlla se l'utente è già loggato al caricamento
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                mostraDashboard(session.user.id);
            } else {
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
            }
        }

        // Funzione per mostrare la dashboard e caricare i crediti
        async function mostraDashboard(userId) {
            loginView.classList.add('hidden');
            dashboardView.classList.remove('hidden');

            // Recupera i crediti dal database
            const { data, error } = await supabase
                .from('profili')
                .select('crediti')
                .eq('id', userId)
                .single();
            
            if (data) {
                creditiBadge.innerText = `Crediti: ${data.crediti}`;
            }
        }

        // Gestione Login / Registrazione unificata
        btnLogin.addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            
            // Prova a fare login
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                if (error.message.includes('Invalid login credentials')) {
                    // Se non esiste, prova a registrarlo automaticamente
                    const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password });
                    if (signUpError) {
                        authMessage.innerText = signUpError.message;
                        authMessage.classList.remove('hidden');
                    } else {
                        alert('Registrazione completata! Ora puoi accedere.');
                    }
                } else {
                    authMessage.innerText = error.message;
                    authMessage.classList.remove('hidden');
                }
            } else {
                mostraDashboard(data.user.id);
            }
        });

        // Gestione Logout
        btnLogout.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.reload();
        });

        // Avvia il controllo all'apertura della pagina
        checkSession();

    </script>
</body>
</html>
